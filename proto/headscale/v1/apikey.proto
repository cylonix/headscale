syntax = "proto3";
package headscale.v1;
option go_package = "github.com/juanfont/headscale/gen/go/v1";

import "google/protobuf/timestamp.proto";
import "headscale/v1/user.proto"; // __CYLONIX_MOD__

message ApiKey {
  uint64 id = 1;
  string prefix = 2;
  google.protobuf.Timestamp expiration = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_seen = 5;
  // __BEGIN_CYLONIX_MOD__
  User user = 6;
  string namespace = 7;
  string network = 8;
  // __END_CYLONIX_MOD__
}

message CreateApiKeyRequest {
  google.protobuf.Timestamp expiration = 1;
  // __BEGIN_CYLONIX_MOD__
  optional string namespace = 2;
  optional string user = 3;
  optional string network = 4;
  optional string scope_type = 5;
  optional string scope_value = 6;
  // __END_CYLONIX_MOD__
}

message CreateApiKeyResponse { string api_key = 1; }

message ExpireApiKeyRequest {
  string prefix = 1;
  uint64 id = 2;
}

message ExpireApiKeyResponse {}

message ListApiKeysRequest {
  // __BEGIN_CYLONIX_MOD__
  optional string user = 1;
  repeated uint64 node_id_list = 2;
  optional string namespace = 3;
  optional string network = 4;
  optional string filter_by = 5;
  optional string filter_value = 6;
  optional string sort_by = 7;
  optional string sort_desc = 8;
  optional uint32 page = 9;
  optional uint32 pageSize = 10;
  // __END_CYLONIX_MOD__
}

message ListApiKeysResponse {
  repeated ApiKey api_keys = 1;
  uint32 total = 2; // __CYLONIX_MOD__
}

message DeleteApiKeyRequest {
  string prefix = 1;
  uint64 id = 2;
}

message DeleteApiKeyResponse {}

// __BEGIN_CYLONIX_MOD__
message RefreshApiKeyRequest { string prefix = 1; }
message RefreshApiKeyResponse {}
// __END_CYLONIX_MOD__
